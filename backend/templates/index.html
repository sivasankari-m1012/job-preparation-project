<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Job Interview Platform</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header>
        <h1>AI Job Interview Platform</h1>
        <p>Track applications and prepare for interviews</p>
    </header>

    <div class="container">

        <section class="add-job">

            <h2>Add Job Application</h2>

            <form id="jobForm">

                <input
                    type="text"
                    id="company"
                    placeholder="Company"
                    required
                >

                <input
                    type="text"
                    id="role"
                    placeholder="Job Role"
                    required
                >

                <select id="status" required>

                    <option value="">
                        Select Status
                    </option>

                    <option value="Applied">
                        Applied
                    </option>

                    <option value="Online Assessment">
                        Online Assessment
                    </option>

                    <option value="Technical Interview">
                        Technical Interview
                    </option>

                    <option value="HR Interview">
                        HR Interview
                    </option>

                    <option value="Selected">
                        Selected
                    </option>

                    <option value="Rejected">
                        Rejected
                    </option>

                </select>

                <button type="submit">
                    Add Job
                </button>

                <input type="text" id="location" placeholder="Location (optional)" maxlength="100">

                <input type="url" id="url" placeholder="Job link (optional)" maxlength="500">

                <input type="date" id="deadline" title="Application deadline (optional)">

                <textarea id="notes" placeholder="Notes (optional)" maxlength="2000" rows="2"></textarea>

            </form>

        </section>


        <section class="applications">

            <h2>My Job Applications</h2>

            <div id="message" role="alert" hidden></div>

            <div id="stats" class="stats"></div>

            <div class="toolbar">
                <input type="search" id="search" placeholder="Search company or role">

                <select id="filterStatus" aria-label="Filter by status">
                    <option value="">All statuses</option>
                </select>

                <select id="sortBy" aria-label="Sort">
                    <option value="created_at:desc">Newest first</option>
                    <option value="created_at:asc">Oldest first</option>
                    <option value="company:asc">Company A-Z</option>
                    <option value="deadline:asc">Deadline (soonest)</option>
                </select>
            </div>

            <div id="jobs"></div>

        </section>


        <section
            id="preparationKit"
            class="preparation-kit"
            style="display: none;"
        >

            <div class="prep-header">

                <h2 id="prepCompanyName">
                    Preparation Kit
                </h2>

            </div>


            <div class="prep-section">

                <h3>Technical Topics</h3>

                <ul id="technicalTopics"></ul>

            </div>


            <div class="prep-section">

                <h3>Coding Topics</h3>

                <ul id="codingTopics"></ul>

            </div>


            <div class="prep-section">

                <h3>Aptitude</h3>

                <ul id="aptitudeTopics"></ul>

            </div>


            <div class="prep-section">

                <h3>Interview Questions</h3>

                <ul id="interviewQuestions"></ul>

            </div>


            <div class="prep-section">

                <h3>Resume Preparation</h3>

                <ul id="resumePreparation"></ul>

            </div>


            <div class="prep-section">

                <h3>Resources</h3>

                <div id="resources"></div>

            </div>

        </section>

    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>

</body>

</html>
